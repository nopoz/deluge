name: Docker

on:
  push:
    branches:
      - downstream
    tags:
      - "prod/*"
  pull_request:
    paths:
      - "packaging/docker/**"
      - ".github/workflows/docker.yml"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=prod/(.*),group=1,prefix=prod-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/prod/') }}

      # Load into the local daemon first so the smoke test runs against the
      # exact image that gets pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          load: true
          tags: deluge-ci:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ./packaging/docker/smoke.sh deluge-ci:candidate

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
